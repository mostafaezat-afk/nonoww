<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الطلبات المسجلة - ملتقى خبراء أوسيم والوراق</title>
    <style>
        /* كل الـ CSS الأصلي يبقى كما هو تماماً */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f4a 0%, #2d8659 50%, #1a5f4a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            border: 5px solid #2d8659;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: white;
            padding: 10px;
        }

        .header h1 {
            color: #1a5f4a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #1a5f4a;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
        }

        .search-filter-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-input:focus {
            outline: none;
            border-color: #2d8659;
        }

        .btn-refresh {
            padding: 12px 30px;
            background: linear-gradient(135deg, #2d8659 0%, #1a5f4a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-refresh:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 134, 89, 0.3);
        }

        .btn-refresh:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-filter {
            padding: 10px 20px;
            border: 2px solid #2d8659;
            background: white;
            color: #2d8659;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-filter:hover, .btn-filter.active {
            background: #2d8659;
            color: white;
        }

        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .request-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-right: 5px solid #2d8659;
        }

        .request-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .request-name {
            color: #1a5f4a;
            font-size: 1.3em;
            font-weight: 700;
        }

        .request-id {
            background: #e8f5f1;
            color: #1a5f4a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .request-info {
            margin-bottom: 10px;
            color: #555;
            line-height: 1.8;
        }

        .request-info strong {
            color: #333;
            margin-left: 5px;
        }

        .request-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
        }

        .no-requests {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .no-requests-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .requests-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://mostafaezat-afk.github.io/nonoww/unnamed%20(9).jpg" alt="شعار ملتقى خبراء أوسيم والوراق">
            </div>
            <h1>📋 صفحة الطلبات المسجلة</h1>
            <h2>طلبات الانضمام للمبادرة</h2>
            <p>ملتقى خبراء أوسيم والوراق - التنمية مسئولية الجميع</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-number" id="totalRequests">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pendingRequests">0</div>
                <div class="stat-label">قيد الانتظار</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-number" id="todayRequests">0</div>
                <div class="stat-label">طلبات اليوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="uniqueJobs">0</div>
                <div class="stat-label">وظائف متنوعة</div>
            </div>
        </div>

        <div class="search-filter-container">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 البحث بالاسم، التليفون، أو العنوان...">
                <button class="btn-refresh" onclick="loadRequests()">🔄 تحديث</button>
            </div>
            <div class="filter-buttons">
                <button class="btn-filter active" data-filter="all">الكل</button>
                <button class="btn-filter" data-filter="معلم">معلم</button>
                <button class="btn-filter" data-filter="طبيب">طبيب</button>
                <button class="btn-filter" data-filter="مهندس">مهندس</button>
                <button class="btn-filter" data-filter="محامي">محامي</button>
                <button class="btn-filter" data-filter="محاسب">محاسب</button>
                <button class="btn-filter" data-filter="موظف">موظف</button>
            </div>
        </div>

        <div class="requests-grid" id="requestsGrid">
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbz2MbLUvSEwGQdwVKYBm1a0FCyo_yNMdFHjgKIoYq5RDL0pXrP1mjhFsSl1ftXl0nFSug/exec';

        let allRequests = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function loadRequests() {
            const refreshBtn = document.querySelector('.btn-refresh');
            const originalText = refreshBtn.innerHTML;
            refreshBtn.innerHTML = '🔄 جاري التحميل...';
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    allRequests = result.data || [];
                    updateStats();
                    displayRequests();
                } else {
                    throw new Error(result.message || 'خطأ في تحميل البيانات');
                }
            } catch (error) {
                console.error('خطأ في تحميل الطلبات:', error);
                document.getElementById('requestsGrid').innerHTML = `
                    <div class="no-requests" style="background: #ffebee;">
                        <div class="no-requests-icon">⚠️</div>
                        <p>حدث خطأ في تحميل الطلبات: ${error.message}</p>
                        <button class="btn-refresh" onclick="loadRequests()" style="margin-top: 15px;">🔄 إعادة المحاولة</button>
                    </div>
                `;
            } finally {
                refreshBtn.innerHTML = originalText;
                refreshBtn.disabled = false;
            }
        }

        function updateStats() {
            const total = allRequests.length;
            const pending = allRequests.filter(r => r.status === 'قيد الانتظار').length;
            const today = allRequests.filter(r => r.registrationDate === new Date().toLocaleDateString('ar-EG')).length;
            const uniqueJobs = new Set(allRequests.map(r => r.expertise)).size;

            document.getElementById('totalRequests').textContent = total;
            document.getElementById('pendingRequests').textContent = pending;
            document.getElementById('todayRequests').textContent = today;
            document.getElementById('uniqueJobs').textContent = uniqueJobs;
        }

        function displayRequests() {
            const container = document.getElementById('requestsGrid');
            
            let filteredRequests = allRequests.filter(request => {
                const matchesFilter = currentFilter === 'all' || request.expertise === currentFilter;
                const matchesSearch = searchQuery === '' || 
                                     request.name.includes(searchQuery) ||
                                     request.phone.includes(searchQuery) ||
                                     request.address.includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            filteredRequests.sort((a, b) => b.id - a.id);

            if (filteredRequests.length === 0) {
                container.innerHTML = `
                    <div class="no-requests">
                        <div class="no-requests-icon">📭</div>
                        <h3>لا توجد طلبات مسجلة</h3>
                        <p>لا توجد طلبات انضمام مطابقة للبحث حالياً</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredRequests.map(request => `
                <div class="request-card">
                    <div class="request-header">
                        <div class="request-name">👤 ${request.name}</div>
                        <div class="request-id">#${request.id}</div>
                    </div>
                    <div class="request-info">
                        <p><strong>📱 التليفون:</strong> ${request.phone}</p>
                        <p><strong>📍 العنوان:</strong> ${request.address}</p>
                        <p><strong>💼 الوظيفة:</strong> ${request.expertise}</p>
                        ${request.notes ? `<p><strong>📝 الملاحظات:</strong> ${request.notes}</p>` : ''}
                        <p><strong>📅 تاريخ التسجيل:</strong> ${request.registrationDate}</p>
                    </div>
                    <div class="request-badge">⏳ قيد الانتظار</div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                displayRequests();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            displayRequests();
        });

        loadRequests();
        setInterval(loadRequests, 10000);
    </script>
</body>
</html>
