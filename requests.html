<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الطلبات المسجلة - ملتقى خبراء أوسيم والوراق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f4a 0%, #2d8659 50%, #1a5f4a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            border: 5px solid #2d8659;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: white;
            padding: 10px;
        }

        .header h1 {
            color: #1a5f4a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #1a5f4a;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
        }

        .search-filter-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-input:focus {
            outline: none;
            border-color: #2d8659;
        }

        .btn-refresh {
            padding: 12px 30px;
            background: linear-gradient(135deg, #2d8659 0%, #1a5f4a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-refresh:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 134, 89, 0.3);
        }

        .btn-refresh:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .no-requests {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .no-requests-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        /* نافذة كلمة السر */
        .password-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .password-modal {
            background: white;
            border-radius: 16px;
            padding: 25px 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .password-modal h3 {
            margin-bottom: 10px;
            color: #1a5f4a;
        }

        .password-modal p {
            margin-bottom: 15px;
            color: #555;
        }

        .password-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .password-input:focus {
            outline: none;
            border-color: #2d8659;
            box-shadow: 0 0 0 3px rgba(45,134,89,0.15);
        }

        .password-error {
            color: #e74c3c;
            font-size: 0.9em;
            min-height: 18px;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://mostafaezat-afk.github.io/nonoww/unnamed%20(9).jpg" alt="شعار ملتقى خبراء أوسيم والوراق">
            </div>
            <h1>📋 صفحة الطلبات المسجلة</h1>
            <h2>طلبات الانضمام للمبادرة</h2>
            <p>ملتقى خبراء أوسيم والوراق - التنمية مسئولية الجميع</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-number" id="totalRequests">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pendingRequests">0</div>
                <div class="stat-label">قيد الانتظار</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-number" id="todayRequests">0</div>
                <div class="stat-label">طلبات اليوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="uniqueJobs">0</div>
                <div class="stat-label">وظائف متنوعة</div>
            </div>
        </div>

        <div class="search-filter-container">
            <div class="search-box">
                <input type="text" class="search-input" id="globalSearchInput" placeholder="🔍 بحث عام (الاسم / التليفون / العنوان / الملاحظات)...">
                <button class="btn-refresh" onclick="loadRequests()">🔄 تحديث</button>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;">
                <input type="text" id="nameFilter" class="search-input" placeholder="فلتر الاسم">
                <input type="text" id="phoneFilter" class="search-input" placeholder="فلتر التليفون">
                <input type="text" id="addressFilter" class="search-input" placeholder="فلتر العنوان">
                <select id="jobFilter" class="search-input">
                    <option value="">كل الوظائف</option>
                </select>
                <input type="text" id="notesFilter" class="search-input" placeholder="فلتر الملاحظات">
                <input type="text" id="dateFilter" class="search-input" placeholder="فلتر التاريخ (مثال: 2025)">
            </div>
        </div>

        <div style="background:white;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);overflow:auto;">
            <table style="width:100%;border-collapse:collapse;min-width:800px;">
                <thead>
                    <tr style="background:#e8f5f1;color:#1a5f4a;">
                        <th style="padding:10px;border-bottom:2px solid #ddd;">#</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">الاسم</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">التليفون</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">العنوان</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">الوظيفة</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">الملاحظات</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">تاريخ التسجيل</th>
                        <th style="padding:10px;border-bottom:2px solid #ddd;">الحالة</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody"></tbody>
            </table>
        </div>

        <div id="noRequestsBox" class="no-requests" style="display:none;">
            <div class="no-requests-icon">📭</div>
            <h3>لا توجد طلبات مسجلة</h3>
            <p>لا توجد طلبات انضمام مطابقة للبحث حالياً</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbymd3Ae6XsIT2bEZlBgwYAiodvK53N5CUTQUEIRHOfmXlY77wWsSomF_3WVKSE2sRJZBw/exec';

        let allRequests = [];
        let filteredRequests = [];

        // SHA-256("3030") (محسوبة مسبقاً)
        const PASSWORD_HASH = '3ac8ccf955f2f9930f4fbabd6ff5f9a587c9abf42a130563282b6d1f3a1a0f0f';

        async function hashText(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(digest))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function showPasswordModal() {
            const overlay = document.createElement('div');
            overlay.className = 'password-modal-overlay';
            overlay.innerHTML = `
                <div class="password-modal">
                    <h3>🔐 صفحة محمية</h3>
                    <p>من فضلك أدخل الرقم السري للوصول إلى صفحة الطلبات</p>
                    <input type="password" id="passwordInput" class="password-input" placeholder="أدخل الرقم السري">
                    <div id="passwordError" class="password-error"></div>
                    <button id="passwordBtn" class="btn-refresh" style="width:100%;margin-top:5px;">دخول</button>
                </div>
            `;
            document.body.appendChild(overlay);

            const inputEl = document.getElementById('passwordInput');
            const errorEl = document.getElementById('passwordError');

            document.getElementById('passwordBtn').addEventListener('click', async () => {
                const input = inputEl.value.trim();
                if (!input) {
                    errorEl.textContent = 'الرجاء إدخال الرقم السري';
                    return;
                }
                try {
                    const hash = await hashText(input);
                    if (hash === PASSWORD_HASH) {
                        overlay.remove();
                        initPage();
                    } else {
                        errorEl.textContent = 'رقم سري غير صحيح';
                    }
                } catch (e) {
                    errorEl.textContent = 'حدث خطأ في التحقق';
                }
            });

            inputEl.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    document.getElementById('passwordBtn').click();
                }
            });

            inputEl.focus();
        }

        async function loadRequests() {
            const btn = document.querySelector('.btn-refresh');
            const old = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '🔄 جاري التحميل...';

            try {
                const res = await fetch(API_URL);
                const result = await res.json();

                if (result.success) {
                    allRequests = result.data || [];
                    buildJobDropdown();
                    applyFilters();
                    updateStats();
                } else {
                    throw new Error(result.message || 'خطأ في تحميل البيانات');
                }
            } catch (err) {
                console.error('خطأ في تحميل الطلبات:', err);
                document.getElementById('requestsTableBody').innerHTML = '';
                const box = document.getElementById('noRequestsBox');
                box.style.display = 'block';
                box.querySelector('p').textContent = 'حدث خطأ في تحميل الطلبات: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = old;
            }
        }

        function buildJobDropdown() {
            const jobSelect = document.getElementById('jobFilter');
            const jobs = Array.from(new Set(allRequests.map(r => r.expertise).filter(Boolean))).sort();
            jobSelect.innerHTML = '<option value="">كل الوظائف</option>';
            jobs.forEach(job => {
                const opt = document.createElement('option');
                opt.value = job;
                opt.textContent = job;
                jobSelect.appendChild(opt);
            });
        }

        function updateStats() {
            const total = allRequests.length;
            const pending = allRequests.filter(r => (r.status || 'قيد الانتظار') === 'قيد الانتظار').length;
            const todayStr = new Date().toLocaleDateString('ar-EG');
            const today = allRequests.filter(r => r.registrationDate === todayStr).length;
            const uniqueJobs = new Set(allRequests.map(r => r.expertise)).size;

            document.getElementById('totalRequests').textContent = total;
            document.getElementById('pendingRequests').textContent = pending;
            document.getElementById('todayRequests').textContent = today;
            document.getElementById('uniqueJobs').textContent = uniqueJobs;
        }

        function applyFilters() {
            const globalSearch = document.getElementById('globalSearchInput').value.trim();
            const nameFilter = document.getElementById('nameFilter').value.trim();
            const phoneFilter = document.getElementById('phoneFilter').value.trim();
            const addressFilter = document.getElementById('addressFilter').value.trim();
            const jobFilter = document.getElementById('jobFilter').value;
            const notesFilter = document.getElementById('notesFilter').value.trim();
            const dateFilter = document.getElementById('dateFilter').value.trim();

            filteredRequests = allRequests.filter(r => {
                const globalMatch =
                    !globalSearch ||
                    (r.name && r.name.includes(globalSearch)) ||
                    (r.phone && r.phone.includes(globalSearch)) ||
                    (r.address && r.address.includes(globalSearch)) ||
                    (r.notes && r.notes.includes(globalSearch));

                const nameMatch = !nameFilter || (r.name && r.name.includes(nameFilter));
                const phoneMatch = !phoneFilter || (r.phone && r.phone.includes(phoneFilter));
                const addressMatch = !addressFilter || (r.address && r.address.includes(addressFilter));
                const jobMatch = !jobFilter || r.expertise === jobFilter;
                const notesMatch = !notesFilter || (r.notes && r.notes.includes(notesFilter));
                const dateMatch = !dateFilter || (r.registrationDate && r.registrationDate.includes(dateFilter));

                return globalMatch && nameMatch && phoneMatch && addressMatch && jobMatch && notesMatch && dateMatch;
            });

            filteredRequests.sort((a, b) => b.id - a.id);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('requestsTableBody');
            const noBox = document.getElementById('noRequestsBox');

            if (!filteredRequests.length) {
                tbody.innerHTML = '';
                noBox.style.display = 'block';
                return;
            }

            noBox.style.display = 'none';

            tbody.innerHTML = filteredRequests.map((r, index) => `
                <tr style="border-bottom:1px solid #eee;">
                    <td style="padding:8px;text-align:center;">${index + 1}</td>
                    <td style="padding:8px;">${r.name || ''}</td>
                    <td style="padding:8px;">${r.phone || ''}</td>
                    <td style="padding:8px;">${r.address || ''}</td>
                    <td style="padding:8px;">${r.expertise || ''}</td>
                    <td style="padding:8px;">${r.notes || ''}</td>
                    <td style="padding:8px;">${r.registrationDate || ''}</td>
                    <td style="padding:8px;">${r.status || 'قيد الانتظار'}</td>
                </tr>
            `).join('');
        }

        function bindFilters() {
            ['globalSearchInput','nameFilter','phoneFilter','addressFilter','notesFilter','dateFilter'].forEach(id => {
                document.getElementById(id).addEventListener('input', applyFilters);
            });
            document.getElementById('jobFilter').addEventListener('change', applyFilters);
        }

        function initPage() {
            bindFilters();
            loadRequests();
            setInterval(loadRequests, 10000);
        }

        window.addEventListener('load', () => {
            showPasswordModal();
        });
    </script>
</body>
</html>
