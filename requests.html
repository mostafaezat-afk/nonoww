<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الطلبات المسجلة - ملتقى خبراء أوسيم والوراق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f4a 0%, #2d8659 50%, #1a5f4a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            border: 5px solid #2d8659;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: white;
            padding: 10px;
        }

        .header h1 {
            color: #1a5f4a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #1a5f4a;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
        }

        .search-filter-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-input:focus {
            outline: none;
            border-color: #2d8659;
        }

        .filter-select {
            padding: 12px 15px;
            border: 2px solid #2d8659;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            color: #2d8659;
            background: white;
            cursor: pointer;
            min-width: 250px;
        }

        .filter-select:focus {
            outline: none;
            border-color: #1a5f4a;
        }

        .btn-refresh {
            padding: 12px 30px;
            background: linear-gradient(135deg, #2d8659 0%, #1a5f4a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 134, 89, 0.3);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background: linear-gradient(135deg, #2d8659 0%, #1a5f4a 100%);
            color: white;
        }

        th {
            padding: 15px 10px;
            text-align: right;
            font-weight: 600;
            font-size: 1em;
            white-space: nowrap;
        }

        th:first-child {
            text-align: center;
            border-radius: 10px 0 0 0;
        }

        th:last-child {
            border-radius: 0 10px 0 0;
        }

        tbody tr {
            border-bottom: 1px solid #e8f5f1;
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: #f0f9f6;
        }

        tbody tr:last-child td:first-child {
            border-radius: 0 0 0 10px;
        }

        tbody tr:last-child td:last-child {
            border-radius: 0 0 10px 0;
        }

        td {
            padding: 15px 10px;
            color: #555;
        }

        .row-number {
            background: #e8f5f1;
            color: #1a5f4a;
            font-weight: 700;
            text-align: center;
            font-size: 1.1em;
        }

        .name-cell {
            color: #1a5f4a;
            font-weight: 600;
        }

        .phone-cell {
            direction: ltr;
            text-align: right;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .no-requests {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .no-requests-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-box {
                flex-direction: column;
            }

            .search-input, .filter-select, .btn-refresh {
                width: 100%;
            }

            .table-container {
                padding: 10px;
            }

            th, td {
                padding: 10px 5px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="https://i.imgur.com/placeholder.png" alt="شعار ملتقى خبراء أوسيم والوراق">
            </div>
            <h1>📋 صفحة الطلبات المسجلة</h1>
            <h2>طلبات الانضمام للمبادرة</h2>
            <p>ملتقى خبراء أوسيم والوراق - التنمية مسئولية الجميع</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-number" id="totalRequests">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pendingRequests">0</div>
                <div class="stat-label">قيد الانتظار</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-number" id="todayRequests">0</div>
                <div class="stat-label">طلبات اليوم</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="uniqueJobs">0</div>
                <div class="stat-label">وظائف متنوعة</div>
            </div>
        </div>

        <div class="search-filter-container">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 البحث بالاسم، التليفون، أو العنوان...">
                
                <select class="filter-select" id="jobFilter">
                    <option value="">جميع الوظائف</option>
                    <option value="معلم">معلم / مدرس</option>
                    <option value="طبيب">طبيب</option>
                    <option value="مهندس">مهندس</option>
                    <option value="محامي">محامي</option>
                    <option value="محاسب">محاسب</option>
                    <option value="صيدلي">صيدلي</option>
                    <option value="موظف">موظف (حكومي/خاص)</option>
                    <option value="تاجر">تاجر / صاحب محل</option>
                    <option value="مندوب مبيعات">مندوب مبيعات</option>
                    <option value="كاشير">كاشير</option>
                    <option value="شيف">طباخ / شيف</option>
                    <option value="ويتر">ويتر / عامل مقهى</option>
                    <option value="حلاق">حلاق / كوافير</option>
                    <option value="جزار">جزار</option>
                    <option value="حرفي">حرفي (عام)</option>
                    <option value="كهربائي">كهربائي</option>
                    <option value="سباك">سباك</option>
                    <option value="نجار">نجار</option>
                    <option value="نقاش">نقاش</option>
                    <option value="ميكانيكي">ميكانيكي</option>
                    <option value="سمكري">سمكري / دوكو</option>
                    <option value="حداد">حداد</option>
                    <option value="الوميتال">فني الوميتال</option>
                    <option value="فني تبريد">فني تكييف وتبريد</option>
                    <option value="فني الكترونيات">فني صيانة (موبايل/دش/كمبيوتر)</option>
                    <option value="ترزي">ترزي / خياط</option>
                    <option value="منجد">منجد</option>
                    <option value="سائق">سائق (خاص/أجرة/نقل)</option>
                    <option value="سائق توكتوك">سائق توكتوك / تروسيكل</option>
                    <option value="دليفري">عامل دليفري / طيار</option>
                    <option value="عامل">عامل / مساعد صنايعي</option>
                    <option value="عامل بناء">عامل بناء / مسلح</option>
                    <option value="أمن">فرد أمن / حارس عقار</option>
                    <option value="عامل نظافة">عامل نظافة</option>
                    <option value="طالب">طالب</option>
                    <option value="ربة منزل">ربة منزل</option>
                    <option value="بالمعاش">بالمعاش</option>
                    <option value="بدون عمل">لا أعمل / متفرغ</option>
                    <option value="أخرى">مهنة أخرى</option>
                </select>
                
                <button class="btn-refresh" onclick="loadRequests()">🔄 تحديث</button>
            </div>
        </div>

        <div class="table-container" id="tableContainer">
        </div>
    </div>

    <script>
        let allRequests = [];
        let currentFilter = '';
        let searchQuery = '';

        function loadRequests() {
            try {
                const storedRequests = localStorage.getItem('membership-requests');
                
                if (storedRequests) {
                    allRequests = JSON.parse(storedRequests);
                } else {
                    allRequests = [];
                }

                updateStats();
                displayRequests();
            } catch (error) {
                console.error('خطأ في تحميل الطلبات:', error);
                document.getElementById('tableContainer').innerHTML = `
                    <div class="no-requests">
                        <div class="no-requests-icon">⚠️</div>
                        <p>حدث خطأ في تحميل الطلبات</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const total = allRequests.length;
            const pending = allRequests.filter(r => r.status === 'pending').length;
            const today = allRequests.filter(r => r.registrationDate === new Date().toLocaleDateString('ar-EG')).length;
            const uniqueJobs = new Set(allRequests.map(r => r.expertise)).size;

            document.getElementById('totalRequests').textContent = total;
            document.getElementById('pendingRequests').textContent = pending;
            document.getElementById('todayRequests').textContent = today;
            document.getElementById('uniqueJobs').textContent = uniqueJobs;
        }

        function displayRequests() {
            const container = document.getElementById('tableContainer');
            
            let filteredRequests = allRequests.filter(request => {
                const matchesFilter = currentFilter === '' || request.expertise === currentFilter;
                const matchesSearch = searchQuery === '' || 
                                     request.name.includes(searchQuery) ||
                                     request.phone.includes(searchQuery) ||
                                     request.address.includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            filteredRequests.sort((a, b) => b.id - a.id);

            if (filteredRequests.length === 0) {
                container.innerHTML = `
                    <div class="no-requests">
                        <div class="no-requests-icon">📭</div>
                        <h3>لا توجد طلبات مسجلة</h3>
                        <p>لا توجد طلبات انضمام مطابقة للبحث حالياً</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>التليفون</th>
                            <th>العنوان</th>
                            <th>الوظيفة</th>
                            <th>الملاحظات</th>
                            <th>تاريخ التسجيل</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredRequests.map((request, index) => `
                            <tr>
                                <td class="row-number">${index + 1}</td>
                                <td class="name-cell">${request.name}</td>
                                <td class="phone-cell">${request.phone}</td>
                                <td>${request.address}</td>
                                <td>${request.expertise}</td>
                                <td>${request.notes || '-'}</td>
                                <td>${request.registrationDate}</td>
                                <td><span class="badge">⏳ قيد الانتظار</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        document.getElementById('jobFilter').addEventListener('change', function(e) {
            currentFilter = e.target.value;
            displayRequests();
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            displayRequests();
        });

        loadRequests();
        setInterval(loadRequests, 10000);
    </script>
</body>
</html>
