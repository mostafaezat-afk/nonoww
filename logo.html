<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حماية الصور - إضافة العلامة المائية</title>
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1><i class="fa-solid fa-shield-halved"></i> حماية الصور</h1>
            <p>قم برفع اللوجو الخاص بك، ثم ارفع الصور لحمايتها</p>
        </header>

        <div class="main-content">

            <!-- خطوة 1: رفع اللوجو -->
            <section class="step-section">
                <div class="step-title">
                    <span class="step-number">1</span>
                    <h2>ارفع اللوجو الخاص بك أولاً</h2>
                </div>
                <div class="logo-upload-area">
                    <input type="file" id="logoInput" accept="image/*" hidden>
                    <label for="logoInput" class="btn outline-btn" id="logoUploadBtn">
                        <i class="fa-solid fa-upload"></i> اختر صورة اللوجو
                    </label>
                    <div id="logoPreviewWrapper" class="hidden">
                        <img id="logoPreview" src="" alt="اللوجو">
                        <span class="success-text"><i class="fa-solid fa-check-circle"></i> تم اختيار اللوجو بنجاح</span>
                    </div>
                    
                    <div class="logo-options hidden" id="logoOptions">
                        <label class="checkbox-label">
                            <input type="checkbox" id="circularLogoCheck" checked>
                            قص اللوجو بشكل دائري (لحذف الخلفية السوداء بالخارج)
                        </label>
                    </div>
                </div>
            </section>

            <!-- خطوة 2: منطقة رفع وعرض الصور -->
            <section class="step-section workspace disabled" id="imagesWorkspace">
                <div class="step-title">
                    <span class="step-number">2</span>
                    <h2>ارفع الصور المراد إضافة العلامة المائية لها</h2>
                </div>
                <div id="dropZone" class="drop-zone">
                    <div class="drop-zone-content">
                        <i class="fa-solid fa-images"></i>
                        <h3>اسحب وأفلت الصور هنا</h3>
                        <p>أو</p>
                        <label for="fileInput" class="btn outline-btn">تصفح الصور</label>
                        <input type="file" id="fileInput" multiple accept="image/*" hidden>
                    </div>
                </div>

                <div class="action-buttons global-actions hidden" id="globalActions">
                    <button id="downloadBtn" class="btn success-btn">
                        <i class="fa-solid fa-download"></i> تحميل الكل (مباشر)
                    </button>
                    <button id="clearBtn" class="btn danger-btn">
                        <i class="fa-solid fa-trash-can"></i> مسح الكل
                    </button>
                </div>

                <div id="previewContainer" class="preview-container hidden">
                    <!-- سيتم عرض الصور المدمجة هنا مع أدوات التحكم الخاصة بكل منها -->
                </div>
            </section>
        </div>
    </div>

    <!-- مكتبة Fabric.js لتمكين التحكم باللمس والسحب داخل الـ Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
